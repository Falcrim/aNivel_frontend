@if (isOpen()) {
  <div class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-3 sm:p-6" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <!-- Backdrop blur -->
    <div
      class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity animate-in fade-in"
      (click)="closeModal()"
    ></div>

    <!-- Modal Panel -->
    <div
      class="relative bg-white border border-slate-200 rounded-2xl sm:rounded-3xl shadow-2xl w-full {{ maxWidthClass() }} z-10 overflow-hidden transform transition-all animate-in zoom-in-95 duration-200"
    >
      <!-- Header -->
      <div class="flex items-center justify-between px-4 sm:px-6 py-4 sm:py-5 border-b border-slate-100 bg-slate-50/70">
        <div class="min-w-0 pr-2">
          <h3 id="modal-title" class="text-base sm:text-lg font-extrabold text-slate-900 tracking-tight truncate">{{ title() }}</h3>
          @if (subtitle()) {
            <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 line-clamp-1">{{ subtitle() }}</p>
          }
        </div>
        <button
          type="button"
          (click)="closeModal()"
          class="text-slate-400 hover:text-slate-700 p-2 rounded-xl hover:bg-slate-100 transition-colors focus:outline-hidden shrink-0 cursor-pointer"
          aria-label="Cerrar ventana"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Body / Projection -->
      <div class="p-4 sm:p-6 max-h-[calc(88vh-7rem)] overflow-y-auto">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
