<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 p-4 rounded-2xl shadow-xl border text-sm backdrop-blur-md transition-all duration-300 transform translate-y-0"
      [ngClass]="{
        'bg-emerald-50/95 border-emerald-300 text-emerald-950 shadow-emerald-900/10': toast.type === 'success',
        'bg-rose-50/95 border-rose-300 text-rose-950 shadow-rose-900/10': toast.type === 'error',
        'bg-amber-50/95 border-amber-300 text-amber-950 shadow-amber-900/10': toast.type === 'warning',
        'bg-white/95 border-slate-200 text-slate-900 shadow-slate-900/10': toast.type === 'info'
      }"
    >
      <!-- Icon -->
      <div class="shrink-0 mt-0.5">
        @if (toast.type === 'success') {
          <svg class="w-5 h-5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        } @else if (toast.type === 'error') {
          <svg class="w-5 h-5 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        } @else if (toast.type === 'warning') {
          <svg class="w-5 h-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        } @else {
          <svg class="w-5 h-5 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
      </div>

      <!-- Content -->
      <div class="flex-1 min-w-0">
        <h4 class="font-bold text-xs tracking-wide uppercase opacity-90">{{ toast.title }}</h4>
        @if (toast.message) {
          <p class="mt-0.5 text-xs opacity-85 leading-relaxed break-words">{{ toast.message }}</p>
        }
      </div>

      <!-- Close Button -->
      <button
        (click)="toastService.remove(toast.id)"
        class="shrink-0 p-1 rounded-lg hover:bg-slate-200/60 text-slate-400 hover:text-slate-700 transition-colors"
        aria-label="Cerrar notificación"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
