<app-modal [isOpen]="isOpen()" [title]="title()" (close)="onCancel()" maxWidthClass="max-w-md">
  <div class="space-y-6">
    <div class="flex items-start gap-4">
      <div
        class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0"
        [ngClass]="isDanger() ? 'bg-rose-50 text-rose-600 border border-rose-200' : 'bg-amber-50 text-amber-600 border border-amber-200'"
      >
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <div>
        <p class="text-sm text-slate-600 leading-relaxed">{{ message() }}</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3 pt-2 border-t border-slate-100">
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="loading()"
        class="px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-medium transition-colors disabled:opacity-50"
      >
        {{ cancelText() }}
      </button>
      <button
        type="button"
        (click)="onConfirm()"
        [disabled]="loading()"
        class="px-4 py-2.5 rounded-xl text-white text-sm font-semibold transition-all shadow-md flex items-center gap-2 disabled:opacity-50"
        [ngClass]="isDanger() ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-600/20' : 'bg-amber-600 hover:bg-amber-700 shadow-amber-600/20'"
      >
        @if (loading()) {
          <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
        }
        {{ confirmText() }}
      </button>
    </div>
  </div>
</app-modal>
