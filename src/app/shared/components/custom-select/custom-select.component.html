<div class="relative w-full text-left">
  @if (label()) {
    <label class="an-label !flex items-center gap-1.5">
      <span>
        {{ label() }}
        @if (required()) {
          <span class="text-[#e52521]">*</span>
        }
      </span>
      @if (tooltip()) {
        <app-info-tooltip [text]="tooltip()" position="top" />
      }
    </label>
  }

  <!-- Trigger Button (Fixed h-[42px] + single-line truncate for pixel-aligned rows) -->
  <button
    #triggerRef
    type="button"
    (click)="toggle()"
    [disabled]="disabled()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    [ngClass]="[
      disabled() ? 'opacity-50 cursor-not-allowed bg-slate-100' : 'bg-[#f8fafc] hover:bg-white cursor-pointer',
      isOpen() ? 'border-[#11406e] ring-2 ring-[#11406e]/20 bg-white' : 'border-[#cfd9e4]'
    ]"
    class="w-full h-[42px] px-3.5 rounded-xl border text-[13px] text-left flex items-center justify-between gap-2 transition-all duration-150 focus:outline-hidden shadow-2xs"
  >
    <div class="flex items-center gap-2 pr-1 min-w-0 flex-1">
      @if (selectedOption(); as opt) {
        @if (opt.icon) {
          <span class="text-sm shrink-0 leading-none">{{ opt.icon }}</span>
        }
        <span class="font-medium text-[#0a284b] truncate block leading-normal">{{ opt.label }}</span>
      } @else {
        <span class="text-[#7e91a4] font-medium truncate block leading-normal">{{ placeholder() }}</span>
      }
    </div>

    <!-- Chevron Icon -->
    <svg
      class="w-4 h-4 text-[#4b637c] shrink-0 transition-transform duration-200"
      [ngClass]="isOpen() ? 'rotate-180 text-[#11406e]' : ''"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Top-Layer Floating Dropdown Listbox -->
  @if (isOpen()) {
    <div
      anFloatingPanel
      [anFloatingAnchor]="triggerRef"
      anFloatingPlacement="bottom"
      anFloatingAlign="start"
      [anFloatingOffset]="6"
      [anFloatingMatchWidth]="true"
      [anFloatingMaxWidth]="448"
      [anFloatingMaxHeight]="288"
      anFloatingKind="dropdown"
      (anFloatingDismiss)="close()"
      role="listbox"
      class="an-floating-enter"
    >
      <div
        class="w-full max-h-full min-h-0 bg-white border border-[#cfd9e4] rounded-2xl shadow-2xl overflow-hidden flex flex-col p-1.5"
      >
        <!-- Integrated Search Input -->
        @if (isSearchActive()) {
          <div class="p-1 pb-1.5 border-b border-slate-100 shrink-0">
            <div class="relative">
              <svg
                class="w-3.5 h-3.5 text-[#7e91a4] absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input
                #searchInput
                type="text"
                [value]="searchTerm()"
                (input)="onSearchInput($event)"
                (click)="$event.stopPropagation()"
                (keydown)="$event.stopPropagation()"
                [placeholder]="searchPlaceholder()"
                class="w-full pl-8 pr-7 py-1.5 rounded-xl bg-[#f8fafc] border border-[#cfd9e4] text-xs text-[#0a284b] placeholder:text-[#7e91a4] focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-[#11406e]/20 focus:border-[#11406e] font-medium transition-all"
              />
              @if (searchTerm()) {
                <button
                  type="button"
                  (click)="clearSearch($event)"
                  class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-0.5 cursor-pointer"
                  title="Limpiar búsqueda"
                >
                  <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              }
            </div>
          </div>
        }

        <!-- Options List -->
        <div class="overflow-y-auto flex-1 min-h-0 space-y-0.5 scrollbar-thin pt-0.5 overscroll-contain">
          @for (opt of filteredOptions(); track $index) {
            <button
              type="button"
              (click)="select(opt)"
              [ngClass]="
                opt.value === value()
                  ? 'bg-[#edf1f5] text-[#0a284b] font-bold'
                  : 'text-[#385370] hover:bg-[#f8fafc] hover:text-[#0a284b] font-medium'
              "
              class="w-full px-3 py-2 rounded-xl text-[13px] text-left flex items-center justify-between gap-3 transition-colors cursor-pointer group"
            >
              <div class="flex items-center gap-2.5 min-w-0 flex-1">
                @if (opt.icon) {
                  <span class="text-base shrink-0">{{ opt.icon }}</span>
                }
                <div class="min-w-0 flex-1">
                  <span class="block leading-snug break-words">{{ opt.label }}</span>
                  @if (opt.subtitle) {
                    <span class="text-[11px] text-[#4b637c] block mt-0.5 leading-snug font-normal">{{ opt.subtitle }}</span>
                  }
                </div>
              </div>

              <div class="flex items-center shrink-0">
                @if (opt.value === value()) {
                  <svg class="w-4 h-4 text-[#11406e] shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                  </svg>
                }
              </div>
            </button>
          } @empty {
            <div class="px-3 py-4 text-center text-xs text-slate-400 space-y-1">
              <p class="font-medium">No se encontraron resultados</p>
              <p class="text-[10px] text-slate-400">Intenta con otro término de búsqueda</p>
            </div>
          }
        </div>
      </div>
    </div>
  }
</div>
