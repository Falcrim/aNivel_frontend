<div class="relative w-full text-left">
  @if (label()) {
    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
      {{ label() }}
      @if (required()) {
        <span class="text-rose-500">*</span>
      }
    </label>
  }

  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggle()"
    [disabled]="disabled()"
    [ngClass]="[
      disabled() ? 'opacity-50 cursor-not-allowed bg-slate-100' : 'bg-slate-50 hover:bg-white cursor-pointer',
      isOpen() ? 'border-amber-500 ring-2 ring-amber-500/20 bg-white' : 'border-slate-200'
    ]"
    class="w-full min-h-[42px] px-3.5 py-2 rounded-xl border text-sm text-left flex items-center justify-between gap-2 transition-all duration-150 focus:outline-hidden"
  >
    <div class="flex items-center gap-2 pr-1 min-w-0 flex-1">
      @if (selectedOption(); as opt) {
        @if (opt.icon) {
          <span class="text-base shrink-0">{{ opt.icon }}</span>
        }
        <div class="min-w-0 flex-1">
          <span class="font-semibold text-slate-900 leading-snug break-words block">{{ opt.label }}</span>
          @if (opt.subtitle) {
            <span class="text-[11px] text-slate-400 block leading-tight font-normal">{{ opt.subtitle }}</span>
          }
        </div>
      } @else {
        <span class="text-slate-400 font-medium">{{ placeholder() }}</span>
      }
    </div>

    <!-- Chevron Icon -->
    <svg
      class="w-4 h-4 text-slate-400 shrink-0 transition-transform duration-200"
      [ngClass]="isOpen() ? 'rotate-180 text-amber-600' : ''"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Floating Dropdown Listbox -->
  @if (isOpen()) {
    <div
      class="absolute left-0 top-full mt-1.5 z-50 min-w-full w-max max-w-[calc(100vw-2rem)] sm:max-w-md bg-white border border-slate-200 rounded-2xl shadow-xl max-h-72 overflow-hidden flex flex-col p-1.5 animate-in fade-in zoom-in-95 duration-150"
    >
      <!-- Integrated Search Input -->
      @if (isSearchActive()) {
        <div class="p-1 pb-1.5 border-b border-slate-100 shrink-0">
          <div class="relative">
            <svg
              class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input
              #searchInput
              type="text"
              [value]="searchTerm()"
              (input)="onSearchInput($event)"
              (click)="$event.stopPropagation()"
              (keydown)="$event.stopPropagation()"
              [placeholder]="searchPlaceholder()"
              class="w-full pl-8 pr-7 py-1.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-800 placeholder:text-slate-400 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 font-medium transition-all"
            />
            @if (searchTerm()) {
              <button
                type="button"
                (click)="clearSearch($event)"
                class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-0.5 cursor-pointer"
                title="Limpiar búsqueda"
              >
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            }
          </div>
        </div>
      }

      <!-- Options List -->
      <div class="overflow-y-auto max-h-56 space-y-0.5 scrollbar-thin pt-0.5">
        @for (opt of filteredOptions(); track opt.label) {
          <button
            type="button"
            (click)="select(opt)"
            [ngClass]="
              opt.value === value()
                ? 'bg-amber-50 text-amber-900 font-bold'
                : 'text-slate-700 hover:bg-slate-50 hover:text-slate-900 font-medium'
            "
            class="w-full px-3 py-2 rounded-xl text-sm text-left flex items-center justify-between gap-3 transition-colors cursor-pointer group"
          >
            <div class="flex items-center gap-2.5 min-w-0 flex-1">
              @if (opt.icon) {
                <span class="text-base shrink-0">{{ opt.icon }}</span>
              }
              <div class="min-w-0 flex-1">
                <span class="block leading-snug break-words">{{ opt.label }}</span>
                @if (opt.subtitle) {
                  <span class="text-[11px] text-slate-400 block mt-0.5 leading-tight font-normal">{{ opt.subtitle }}</span>
                }
              </div>
            </div>

            <div class="flex items-center shrink-0">
              @if (opt.value === value()) {
                <svg class="w-4 h-4 text-amber-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                </svg>
              }
            </div>
          </button>
        } @empty {
          <div class="px-3 py-4 text-center text-xs text-slate-400 space-y-1">
            <p class="font-medium">No se encontraron resultados</p>
            <p class="text-[10px] text-slate-400">Intenta con otro término de búsqueda</p>
          </div>
        }
      </div>
    </div>
  }
</div>
