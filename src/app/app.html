<div class="min-h-screen bg-[#edf1f5] text-[#0a284b] flex font-sans antialiased selection:bg-[#11406e] selection:text-white">
  <!-- Sidebar -->
  <app-sidebar
    [isMobileOpen]="isMobileSidebarOpen()"
    (closeMobile)="closeMobileSidebar()"
  />

  <!-- Main Content Layout -->
  <div class="flex-1 flex flex-col min-w-0 lg:pl-64">
    <!-- Header -->
    <app-header
      (toggleMobileSidebar)="toggleMobileSidebar()"
    />

    <!-- Main View Outlet -->
    <main class="flex-1 w-full max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-7 py-5 sm:py-6 min-w-0">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="py-4 sm:py-6 px-4 sm:px-8 border-t border-slate-200/80 bg-white text-center text-[11px] sm:text-xs text-slate-500">
      <p>
        <span class="font-bold text-slate-700">aNivel</span> &copy; 2026 &bull; Plataforma de Gestión de Obras, Catálogos y Control de Costos.
      </p>
    </footer>
  </div>

  <!-- Global Toast Notifications Container -->
  <app-toast-container />
</div>
