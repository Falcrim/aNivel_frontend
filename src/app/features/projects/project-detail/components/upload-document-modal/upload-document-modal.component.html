<app-modal
  [isOpen]="isOpen()"
  title="Subir Cotización o Documento"
  subtitle="Adjunta comprobantes, proformas o especificaciones para el histórico de esta obra."
  maxWidthClass="max-w-2xl"
  (close)="closeModal()"
>
  <form (ngSubmit)="submit()" class="space-y-4">
    <!-- Drag & Drop Zone -->
    @if (!selectedFile()) {
      <div
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        (click)="fileInput.click()"
        [ngClass]="isDragging() ? 'border-amber-500 bg-amber-50/50 scale-[0.99]' : 'border-slate-300 bg-slate-50/60 hover:bg-amber-50/20 hover:border-amber-400'"
        class="border-2 border-dashed rounded-2xl p-6 text-center transition-all cursor-pointer group flex flex-col items-center justify-center gap-2"
      >
        <input
          #fileInput
          type="file"
          class="hidden"
          accept=".pdf,.xlsx,.xls,.csv,.docx,.doc,.png,.jpg,.jpeg,.webp"
          (change)="onFileChange($event)"
        />

        <div
          [ngClass]="isDragging() ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/30' : 'bg-white text-slate-500 border border-slate-200 group-hover:text-amber-600 group-hover:border-amber-300'"
          class="w-12 h-12 rounded-2xl flex items-center justify-center transition-all shadow-2xs"
        >
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
        </div>

        <div class="space-y-0.5">
          <p class="text-xs font-bold text-slate-800">
            <span class="text-amber-600 group-hover:underline">Haz clic para seleccionar</span> o arrastra tu archivo aquí
          </p>
          <p class="text-[11px] text-slate-400">
            PDF, Excel (.xlsx, .xls), Word (.docx) o imágenes (PNG, JPG). Hasta 25 MB.
          </p>
        </div>
      </div>
    } @else {
      <!-- Selected File Card Preview -->
      <div class="p-3.5 rounded-2xl bg-amber-50/70 border border-amber-200/80 flex items-center justify-between gap-3 animate-in fade-in duration-150">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center font-bold text-xs uppercase shrink-0 shadow-xs">
            {{ selectedFile()?.name?.split('.')?.pop() || 'FILE' }}
          </div>
          <div class="min-w-0">
            <p class="text-xs font-bold text-slate-900 truncate">
              {{ selectedFile()?.name }}
            </p>
            <p class="text-[11px] text-slate-500 font-mono">
              {{ formattedFileSize() }}
            </p>
          </div>
        </div>

        <button
          type="button"
          (click)="removeSelectedFile()"
          class="p-1.5 rounded-xl hover:bg-amber-100 text-amber-700 hover:text-rose-600 transition-colors cursor-pointer"
          title="Cambiar archivo"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    }

    <!-- Título / Concepto -->
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">
        Título o Concepto de la Cotización <span class="text-rose-500">*</span>
      </label>
      <input
        type="text"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
        name="title"
        placeholder="Ej: Cotización Fierro Corrugado 1/2 - Las Lomas"
        required
        class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 placeholder:text-slate-400 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all font-medium"
      />
    </div>

    <!-- Grid 2 Columnas: Tipo de Documento y Subcategoría Vinculada -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Tipo de Documento
        </label>
        <app-custom-select
          [options]="typeOptions"
          [(value)]="documentType"
          placeholder="Seleccionar tipo..."
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Etapa / Subcategoría (Opcional)
        </label>
        <app-custom-select
          [options]="subcategoryOptions()"
          [(value)]="subcategoryId"
          [searchable]="true"
          searchPlaceholder="Buscar etapa o subcategoría..."
          placeholder="Seleccionar subcategoría..."
        />
      </div>
    </div>

    <!-- Grid 2 Columnas: Proveedor y Monto Cotizado -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Proveedor / Empresa (Opcional)
        </label>
        <input
          type="text"
          [ngModel]="supplierName()"
          (ngModelChange)="supplierName.set($event)"
          name="supplierName"
          placeholder="Ej: Ferretería El Sol / Campero SRL"
          class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 placeholder:text-slate-400 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all font-medium"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Monto Cotizado (Opcional)
        </label>
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <input
              type="number"
              step="0.01"
              min="0"
              [ngModel]="quotedAmount()"
              (ngModelChange)="quotedAmount.set($event)"
              name="quotedAmount"
              placeholder="0.00"
              class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 placeholder:text-slate-400 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all font-mono font-bold tabular-nums"
            />
          </div>
          <div class="w-36">
            <app-custom-select
              [options]="currencyOptions"
              [(value)]="currency"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Notas u Observaciones -->
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">
        Notas u Observaciones (Opcional)
      </label>
      <textarea
        rows="2"
        [ngModel]="notes()"
        (ngModelChange)="notes.set($event)"
        name="notes"
        placeholder="Ej: Vigencia de precios por 15 días. Incluye flete hasta obra."
        class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 placeholder:text-slate-400 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all resize-none font-medium"
      ></textarea>
    </div>

    <!-- Modal Actions Footer -->
    <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2.5">
      <button
        type="button"
        (click)="closeModal()"
        [disabled]="isSubmitting()"
        class="px-4 py-2.5 rounded-2xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-100 hover:text-slate-800 transition-all cursor-pointer"
      >
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="!selectedFile() || isSubmitting()"
        class="px-5 py-2.5 rounded-2xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold transition-all shadow-md shadow-amber-600/20 active:scale-95 flex items-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100"
      >
        @if (isSubmitting()) {
          <svg class="animate-spin -ml-1 mr-1 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Subiendo...
        } @else {
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          Guardar Documento
        }
      </button>
    </div>
  </form>
</app-modal>
