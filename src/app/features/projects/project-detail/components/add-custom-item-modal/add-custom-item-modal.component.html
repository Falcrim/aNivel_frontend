<app-modal
  [isOpen]="isOpen()"
  title="Crear Ítem Personalizado (Ad-hoc)"
  subtitle="Material exclusivo para esta obra no existente en el catálogo maestro"
  maxWidthClass="max-w-2xl"
  (close)="handleClose()"
>
  <form (submit)="$event.preventDefault(); submit()" class="space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <app-custom-select
          [options]="subcategoryOptions()"
          [value]="form().subcategory"
          (valueChange)="updateFormSubcat($event)"
          label="Subcategoría"
          [required]="true"
          placeholder="Seleccionar subcategoría..."
        />
      </div>

      <div>
        <label for="custName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
          Nombre del Material <span class="text-rose-500">*</span>
        </label>
        <input
          id="custName"
          type="text"
          [(ngModel)]="form().name"
          name="custName"
          required
          placeholder="Ej. Aditivo acelerante especial..."
          class="w-full min-h-[42px] px-3.5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-sm focus:outline-hidden focus:border-amber-500 focus:bg-white focus:ring-2 focus:ring-amber-500/20 shadow-2xs font-medium"
        />
      </div>
    </div>

    <!-- Units -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <app-custom-select
          [options]="uomOptions()"
          [value]="form().unit_measure"
          (valueChange)="updateFormUom($event)"
          label="Unidad Obra"
          [required]="true"
          placeholder="Unidad de obra..."
        />
      </div>

      <div>
        <app-custom-select
          [options]="puOptions()"
          [value]="form().unit_purchase"
          (valueChange)="updateFormPu($event)"
          label="Unidad Compra"
          [required]="true"
          placeholder="Unidad de compra..."
        />
      </div>

      <div>
        <label for="custPrice" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
          Precio Unit. Compra (Bs) *
        </label>
        <div class="relative rounded-2xl bg-white border border-slate-300 focus-within:border-amber-500 focus-within:ring-2 focus-within:ring-amber-500/20 transition-all shadow-2xs">
          <span class="absolute left-3.5 top-2.5 text-xs text-slate-400 font-bold pointer-events-none font-mono">Bs</span>
          <input
            id="custPrice"
            type="number"
            step="0.01"
            min="0"
            [(ngModel)]="form().price_per_purchase_unit"
            name="custPrice"
            required
            placeholder="0.00"
            class="w-full pl-9 pr-4 py-2.5 bg-transparent text-slate-900 text-xs font-mono tabular-nums focus:outline-hidden"
          />
        </div>
      </div>
    </div>

    <!-- Toggle Is Global -->
    <div class="p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl flex items-center justify-between">
      <div>
        <span class="text-xs font-bold text-slate-900 block">¿Es Ítem Global (Paquete cerrado)?</span>
        <span class="text-[11px] text-slate-500">Si se activa, no requiere cómputo métrico ni factor de conversión.</span>
      </div>
      <input
        type="checkbox"
        [(ngModel)]="form().is_global"
        name="custIsGlobal"
        class="w-5 h-5 accent-amber-500 rounded-lg cursor-pointer"
      />
    </div>

    <!-- Inputs if normal item -->
    @if (!form().is_global) {
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label for="custQtyObra" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
            Cómputo en Obra *
          </label>
          <input
            id="custQtyObra"
            type="number"
            step="0.01"
            [(ngModel)]="form().quantity_obra"
            name="custQtyObra"
            required
            placeholder="0.00"
            class="w-full px-4 py-2.5 rounded-2xl bg-white border border-slate-300 text-slate-900 text-xs font-mono tabular-nums focus:outline-hidden focus:border-amber-500 shadow-2xs"
          />
        </div>

        <div>
          <label for="custFactor" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
            Factor Conversión *
          </label>
          <input
            id="custFactor"
            type="number"
            step="0.0001"
            [(ngModel)]="form().conversion_factor"
            name="custFactor"
            required
            placeholder="1.0"
            class="w-full px-4 py-2.5 rounded-2xl bg-white border border-slate-300 text-slate-900 text-xs font-mono tabular-nums focus:outline-hidden focus:border-amber-500 shadow-2xs"
          />
        </div>

        <div>
          <label for="custWaste" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
            % Merma
          </label>
          <div class="relative rounded-2xl bg-white border border-slate-300 focus-within:border-amber-500 transition-all shadow-2xs">
            <input
              id="custWaste"
              type="number"
              step="1"
              min="0"
              max="100"
              [(ngModel)]="form().waste_pct"
              name="custWaste"
              placeholder="0"
              class="w-full px-4 py-2.5 bg-transparent text-slate-900 text-xs font-mono tabular-nums focus:outline-hidden pr-8"
            />
            <span class="absolute right-3 top-2.5 text-xs text-slate-400 font-bold pointer-events-none">%</span>
          </div>
        </div>
      </div>
    } @else {
      <div>
        <label for="custQtyPu" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
          Cantidad a Comprar (Paquete) *
        </label>
        <input
          id="custQtyPu"
          type="number"
          step="0.01"
          min="0.01"
          [(ngModel)]="form().quantity_purchase"
          name="custQtyPu"
          required
          class="w-full px-4 py-2.5 rounded-2xl bg-white border border-slate-300 text-slate-900 text-xs font-mono tabular-nums focus:outline-hidden focus:border-amber-500 shadow-2xs"
        />
      </div>
    }

    <!-- Weight & Detail -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="custWeight" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
          Peso Referencial (kg / unidad compra)
        </label>
        <div class="relative rounded-2xl bg-white border border-slate-300 focus-within:border-amber-500 transition-all shadow-2xs">
          <input
            id="custWeight"
            type="number"
            step="0.01"
            min="0"
            [(ngModel)]="form().weight_per_purchase_unit"
            name="custWeight"
            placeholder="Opcional..."
            class="w-full px-4 py-2.5 bg-transparent text-slate-900 text-xs font-mono tabular-nums focus:outline-hidden pr-8"
          />
          <span class="absolute right-3 top-2.5 text-[11px] font-bold text-slate-400 pointer-events-none">kg</span>
        </div>
      </div>

      <div>
        <label for="custDetail" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
          Detalle / Especificación
        </label>
        <input
          id="custDetail"
          type="text"
          [(ngModel)]="form().detail"
          name="custDetail"
          placeholder="Ej. Uso exclusivo en zapatas..."
          class="w-full px-4 py-2.5 rounded-2xl bg-white border border-slate-300 text-slate-900 text-xs focus:outline-hidden focus:border-amber-500 shadow-2xs"
        />
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="handleClose()"
        [disabled]="isProcessing()"
        class="px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold transition-colors"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="isProcessing() || !form().name"
        class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold transition-all shadow-md shadow-amber-500/20 disabled:opacity-50 active:scale-95 cursor-pointer"
      >
        @if (isProcessing()) {
          <svg class="animate-spin w-4 h-4 text-white inline-block mr-1" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
        }
        Crear Ítem Ad-hoc
      </button>
    </div>
  </form>
</app-modal>
