<app-modal
  [isOpen]="isOpen()"
  title="Editar Tarea de Mano de Obra"
  subtitle="Modifica la cantidad, tarifa unitaria o detalle de la labor"
  maxWidthClass="max-w-xl"
  (close)="close.emit()"
>
  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Subcategoría / Etapa -->
    <div class="space-y-1.5">
      <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
        Etapa Constructiva / Subcategoría <span class="text-rose-500">*</span>
      </label>
      <app-custom-select
        [options]="subcategoryOptions()"
        [value]="subcategoryId()"
        (valueChange)="subcategoryId.set($any($event))"
        placeholder="Seleccionar etapa..."
      />
    </div>

    <!-- Nombre de la Tarea -->
    <div class="space-y-1.5">
      <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
        Nombre de la Tarea / Actividad <span class="text-rose-500">*</span>
      </label>
      <input
        type="text"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        name="name"
        required
        class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-medium focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
      />
    </div>

    <!-- 3 Columnas: Unidad, Cantidad y Costo Unitario -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
      <div class="space-y-1.5">
        <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
          Unidad <span class="text-rose-500">*</span>
        </label>
        <app-custom-select
          [options]="unitOptions()"
          [value]="unitId()"
          (valueChange)="unitId.set($any($event))"
          placeholder="Unidad..."
        />
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
          Cantidad <span class="text-rose-500">*</span>
        </label>
        <input
          type="number"
          step="0.01"
          min="0"
          [ngModel]="quantity()"
          (ngModelChange)="quantity.set($event)"
          name="quantity"
          required
          class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-mono focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
        />
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
          Costo Unit. (Bs) <span class="text-rose-500">*</span>
        </label>
        <input
          type="number"
          step="0.01"
          min="0"
          [ngModel]="unitCost()"
          (ngModelChange)="unitCost.set($event)"
          name="unitCost"
          required
          class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-mono focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
        />
      </div>
    </div>

    <!-- Contratista / Cuadrilla -->
    <div class="space-y-1.5">
      <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
        Contratista / Cuadrilla Asignada
      </label>
      <input
        type="text"
        [ngModel]="contractorName()"
        (ngModelChange)="contractorName.set($event)"
        name="contractorName"
        placeholder="Ej: Contratista Obra Gris y Fina"
        class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
      />
    </div>

    <!-- Detalle / Alcance específico -->
    <div class="space-y-1.5">
      <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
        Detalle / Alcance específico
      </label>
      <input
        type="text"
        [ngModel]="detail()"
        (ngModelChange)="detail.set($event)"
        name="detail"
        class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
      />
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center justify-end gap-2.5 pt-4 border-t border-slate-100">
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 rounded-2xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="isSubmitting() || !subcategoryId() || !unitId() || !name().trim() || quantity() === null || unitCost() === null"
        class="px-5 py-2.5 rounded-2xl text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 active:scale-95 disabled:opacity-50 transition-all shadow-md shadow-amber-600/20 cursor-pointer flex items-center gap-2"
      >
        @if (isSubmitting()) {
          <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          Guardando...
        } @else {
          Guardar Cambios
        }
      </button>
    </div>
  </form>
</app-modal>
