<app-modal
  [isOpen]="isOpen()"
  title="Registrar Compra / Gasto Real"
  subtitle="Ingresa el desembolso efectuado y adjunta su factura o comprobante de pago."
  maxWidthClass="max-w-2xl"
  (close)="closeModal()"
>
  <form (ngSubmit)="submit()" class="space-y-4">
    <!-- Grid Categoría y Subcategoría / Etapa -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Categoría del Gasto <span class="text-rose-500">*</span>
        </label>
        <app-custom-select
          [options]="categoryOptions"
          [(value)]="categoryType"
          placeholder="Seleccionar categoría..."
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Etapa / Subcategoría
        </label>
        <app-custom-select
          [options]="subcategoryOptions()"
          [(value)]="subcategoryId"
          [searchable]="true"
          searchPlaceholder="Buscar etapa o subcategoría..."
          placeholder="Seleccionar subcategoría..."
        />
      </div>
    </div>

    <!-- Descripción del Ítem / Compra -->
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">
        Descripción del Ítem o Servicio <span class="text-rose-500">*</span>
      </label>
      <input
        type="text"
        [ngModel]="itemName()"
        (ngModelChange)="itemName.set($event)"
        name="itemName"
        placeholder="Ej: Barra de acero corrugado 3/8&quot;x12m. (10mm²) o Cemento Warnes"
        required
        class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 placeholder:text-slate-400 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all font-medium"
      />
    </div>

    <!-- Grid Cantidad, Unidad, P.U. y Total Calculado -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50/80 p-3.5 rounded-2xl border border-slate-200/80">
      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-1">Unidad</label>
        <input
          type="text"
          [ngModel]="unitName()"
          (ngModelChange)="unitName.set($event)"
          name="unitName"
          placeholder="Barra, m³, Kg..."
          class="w-full px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs text-slate-800 font-bold focus:outline-hidden focus:ring-1 focus:ring-amber-500"
        />
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-1">Cantidad</label>
        <input
          type="number"
          step="0.01"
          min="0.01"
          [ngModel]="quantity()"
          (ngModelChange)="quantity.set($event); onQuantityOrPriceChange()"
          name="quantity"
          class="w-full px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs text-slate-900 font-bold font-mono tabular-nums focus:outline-hidden focus:ring-1 focus:ring-amber-500"
        />
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-1">P. Unitario (Bs)</label>
        <input
          type="number"
          step="0.01"
          min="0"
          [ngModel]="unitPrice()"
          (ngModelChange)="unitPrice.set($event); onQuantityOrPriceChange()"
          name="unitPrice"
          placeholder="0.00"
          class="w-full px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs text-slate-900 font-bold font-mono tabular-nums focus:outline-hidden focus:ring-1 focus:ring-amber-500"
        />
      </div>

      <div>
        <label class="block text-[11px] font-bold text-amber-800 mb-1">Total (Bs)</label>
        <input
          type="number"
          step="0.01"
          min="0"
          [ngModel]="totalPrice()"
          (ngModelChange)="totalPrice.set($event)"
          name="totalPrice"
          placeholder="0.00"
          class="w-full px-3 py-2 rounded-xl bg-amber-50 border border-amber-300 text-xs text-amber-900 font-black font-mono tabular-nums focus:outline-hidden focus:ring-1 focus:ring-amber-500"
        />
      </div>
    </div>

    <!-- Grid: Fecha, Estado y Forma de Pago -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Fecha de Pago / Compra <span class="text-rose-500">*</span>
        </label>
        <input
          type="date"
          [ngModel]="expenseDate()"
          (ngModelChange)="expenseDate.set($event)"
          name="expenseDate"
          required
          class="w-full px-3 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 font-mono font-medium focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Estado
        </label>
        <app-custom-select
          [options]="statusOptions"
          [(value)]="paymentStatus"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Modalidad de Pago
        </label>
        <input
          type="text"
          [ngModel]="paymentMethod()"
          (ngModelChange)="paymentMethod.set($event)"
          name="paymentMethod"
          placeholder="Ej: AL CONTADO, PAGADO CON FAR..."
          class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 uppercase font-medium"
        />
      </div>
    </div>

    <!-- Grid: Proveedor y N° de Rendición -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Proveedor / Empresa (Opcional)
        </label>
        <input
          type="text"
          [ngModel]="supplierName()"
          (ngModelChange)="supplierName.set($event)"
          name="supplierName"
          placeholder="Ej: Las Lomas SRL / Ferretería El Sol"
          class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 font-medium"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          N° de Rendición de Fondos (Opcional)
        </label>
        <input
          type="text"
          [ngModel]="rendicionNumber()"
          (ngModelChange)="rendicionNumber.set($event)"
          name="rendicionNumber"
          placeholder="Ej: Nr° 04 o Rendición 01"
          class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 font-medium"
        />
      </div>
    </div>

    <!-- Sección de Comprobante / Factura Adjunta -->
    <div class="p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl space-y-2.5">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
          <svg class="w-4 h-4 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          Comprobante / Factura de Respaldo
        </span>
        <span class="text-[10px] text-slate-400">PDF o Imagen (Hasta 25 MB)</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
        <div>
          <input
            type="text"
            [ngModel]="receiptNumber()"
            (ngModelChange)="receiptNumber.set($event)"
            name="receiptNumber"
            placeholder="N° de Factura o Recibo (opcional)"
            class="w-full px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs text-slate-800 placeholder:text-slate-400 focus:outline-hidden focus:ring-1 focus:ring-amber-500"
          />
        </div>

        <div>
          @if (!selectedReceiptFile()) {
            <label class="px-3 py-2 rounded-xl border border-dashed border-amber-400 bg-amber-50/50 hover:bg-amber-100/50 text-amber-800 text-xs font-bold transition-all flex items-center justify-center gap-1.5 cursor-pointer">
              <input
                type="file"
                class="hidden"
                accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx"
                (change)="onFileSelected($event)"
              />
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
              </svg>
              Adjuntar Factura / Recibo
            </label>
          } @else {
            <div class="flex items-center justify-between gap-2 px-3 py-1.5 bg-white border border-emerald-300 rounded-xl text-xs">
              <span class="truncate font-medium text-emerald-800 max-w-[170px]">
                📎 {{ selectedReceiptFile()?.name }}
              </span>
              <button
                type="button"
                (click)="removeReceiptFile()"
                class="text-slate-400 hover:text-rose-600 p-0.5 cursor-pointer"
                title="Quitar comprobante"
              >
                ×
              </button>
            </div>
          }
        </div>
      </div>
    </div>

    <!-- Detalle / Observaciones -->
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">
        Detalle u Observaciones (Opcional)
      </label>
      <textarea
        rows="2"
        [ngModel]="details()"
        (ngModelChange)="details.set($event)"
        name="details"
        placeholder="Ej: Se pagó con factura (1140bs/m3) pero será devuelto el precio del mismo..."
        class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 placeholder:text-slate-400 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all resize-none font-medium"
      ></textarea>
    </div>

    <!-- Footer Actions -->
    <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2.5">
      <button
        type="button"
        (click)="closeModal()"
        [disabled]="isSubmitting()"
        class="px-4 py-2.5 rounded-2xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-100 hover:text-slate-800 transition-all cursor-pointer"
      >
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="isSubmitting() || !itemName().trim()"
        class="px-5 py-2.5 rounded-2xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold transition-all shadow-md shadow-amber-600/20 active:scale-95 flex items-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (isSubmitting()) {
          <svg class="animate-spin -ml-1 mr-1 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Guardando...
        } @else {
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
          </svg>
          Guardar Gasto Real
        }
      </button>
    </div>
  </form>
</app-modal>
