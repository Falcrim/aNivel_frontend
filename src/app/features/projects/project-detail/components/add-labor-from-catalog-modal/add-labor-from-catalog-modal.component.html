<app-modal
  [isOpen]="isOpen()"
  title="Agregar Tarea desde Catálogo"
  subtitle="Selecciona una actividad predefinida del tarifario de mano de obra"
  maxWidthClass="max-w-xl"
  (close)="close.emit()"
>
  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Selector de Tarea de Catálogo -->
    <div class="space-y-1.5">
      <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
        Tarea / Actividad del Catálogo <span class="text-rose-500">*</span>
      </label>
      <app-custom-select
        [options]="catalogOptions()"
        [value]="selectedCatalogItemId()"
        (valueChange)="selectedCatalogItemId.set($any($event))"
        placeholder="Buscar tarea en el catálogo..."
      />
    </div>

    <!-- Información del ítem seleccionado si existe -->
    @if (selectedCatalogItem(); as item) {
      <div class="p-3.5 rounded-2xl bg-amber-50/60 border border-amber-200/70 text-xs space-y-1">
        <div class="flex items-center justify-between font-bold text-amber-900">
          <span>{{ item.name }}</span>
          <span class="font-mono">Tarifa sugerida: Bs {{ item.suggested_cost }} / {{ item.unit_detail?.abbreviation }}</span>
        </div>
        @if (item.detail) {
          <p class="text-slate-600 text-[11px] leading-relaxed">{{ item.detail }}</p>
        }
      </div>
    }

    <!-- 2 Columnas: Cantidad (Cómputo) y Tarifa Pactada (Bs) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-1">
      <div class="space-y-1.5">
        <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
          Cantidad a Ejecutar <span class="text-rose-500">*</span>
        </label>
        <div class="relative">
          <input
            type="number"
            step="0.01"
            min="0"
            [ngModel]="quantity()"
            (ngModelChange)="quantity.set($event)"
            name="quantity"
            required
            placeholder="0.00"
            class="w-full px-3.5 py-2.5 pr-14 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-mono focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
          />
          <span class="absolute right-3.5 top-2.5 text-xs text-slate-400 font-bold pointer-events-none">
            {{ selectedCatalogItem()?.unit_detail?.abbreviation || 'u' }}
          </span>
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
          Costo Unitario Pactado (Bs)
        </label>
        <div class="relative">
          <input
            type="number"
            step="0.01"
            min="0"
            [ngModel]="costOverride()"
            (ngModelChange)="costOverride.set($event)"
            name="costOverride"
            placeholder="0.00"
            class="w-full px-3.5 py-2.5 pr-12 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-mono focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
          />
          <span class="absolute right-3.5 top-2.5 text-xs text-slate-400 font-bold pointer-events-none">
            Bs
          </span>
        </div>
      </div>
    </div>

    <!-- Contratista / Cuadrilla -->
    <div class="space-y-1.5">
      <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
        Contratista / Cuadrilla Asignada
      </label>
      <input
        type="text"
        [ngModel]="contractorName()"
        (ngModelChange)="contractorName.set($event)"
        name="contractorName"
        placeholder="Ej: Contratista Obra Gris y Fina"
        class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
      />
    </div>

    <!-- Detalle / Especificación para esta obra -->
    <div class="space-y-1.5">
      <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
        Detalle / Alcance específico para la obra
      </label>
      <input
        type="text"
        [ngModel]="detail()"
        (ngModelChange)="detail.set($event)"
        name="detail"
        placeholder="Ej: Arrancan desde vigas y 1era fila impermeabilizada"
        class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
      />
    </div>

    <!-- Botones -->
    <div class="flex items-center justify-end gap-2.5 pt-4 border-t border-slate-100">
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 rounded-2xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="isSubmitting() || !selectedCatalogItemId() || quantity() === null"
        class="px-5 py-2.5 rounded-2xl text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 active:scale-95 disabled:opacity-50 transition-all shadow-md shadow-amber-600/20 cursor-pointer flex items-center gap-2"
      >
        @if (isSubmitting()) {
          <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          Agregando...
        } @else {
          Agregar al Presupuesto
        }
      </button>
    </div>
  </form>
</app-modal>
