<app-modal
  [isOpen]="isOpen()"
  title="Editar Información de la Obra"
  subtitle="Actualiza el nombre, estado operativo, superficie y tipo de cambio"
  maxWidthClass="max-w-lg"
  (close)="close.emit()"
>
  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Nombre de la Obra -->
    <div>
      <label class="an-label">
        Nombre de la Obra <span class="text-[#e52521]">*</span>
      </label>
      <input
        type="text"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        name="name"
        required
        placeholder="Ej: Proyecto Zabalaga"
        class="an-input"
      />
    </div>

    <!-- Estado de la Obra -->
    <div>
      <app-custom-select
        [options]="statusOptions"
        [value]="status()"
        (valueChange)="status.set($any($event))"
        label="Estado de la Obra"
        [required]="true"
        placeholder="Seleccionar estado"
      />
    </div>

    <!-- 2 Columnas: Superficie Construida (m2) y Tipo de Cambio (Bs/USD) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 items-start">
      <div>
        <label class="an-label !flex items-center gap-1.5">
          <span>Superficie Construida (m²)</span>
          <app-info-tooltip text="Área total construida de la obra usada para calcular el indicador de incidencia en $/m²." />
        </label>
        <div class="an-input-group">
          <input
            type="number"
            step="0.01"
            min="0"
            [ngModel]="builtArea()"
            (ngModelChange)="builtArea.set($event)"
            name="builtArea"
            placeholder="Ej: 229.50"
            class="w-full h-full px-3.5 pr-12 bg-transparent text-[#0a284b] text-[13px] font-mono focus:outline-hidden"
          />
          <span class="absolute right-3.5 text-xs text-[#4b637c] font-bold pointer-events-none">
            m²
          </span>
        </div>
      </div>

      <div>
        <label class="an-label !flex items-center gap-1.5">
          <span>Tipo de Cambio (Bs/$)</span>
          <app-info-tooltip text="Cotización referencial usada en esta obra para convertir automáticamente todos los subtotales de Bolivianos a Dólares." />
        </label>
        <div class="an-input-group">
          <input
            type="number"
            step="0.01"
            min="0.01"
            [ngModel]="exchangeRate()"
            (ngModelChange)="exchangeRate.set($event)"
            name="exchangeRate"
            placeholder="6.97"
            class="w-full h-full px-3.5 pr-14 bg-transparent text-[#0a284b] text-[13px] font-mono focus:outline-hidden"
          />
          <span class="absolute right-3.5 text-xs text-[#4b637c] font-bold pointer-events-none">
            Bs/$
          </span>
        </div>
      </div>
    </div>

    <!-- Botones de Acción (Esquema 1) -->
    <div class="flex items-center justify-end gap-2.5 pt-4 border-t border-slate-100">
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2.5 rounded-xl border border-[#cfd9e4] hover:bg-[#edf1f5] text-xs font-bold text-[#385370] transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="isSaving() || !name().trim()"
        class="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-[#11406e] hover:bg-[#0a284b] active:scale-95 disabled:opacity-50 transition-all shadow-md shadow-[#11406e]/20 cursor-pointer flex items-center gap-2"
      >
        @if (isSaving()) {
          <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          Guardando...
        } @else {
          Guardar Cambios
        }
      </button>
    </div>
  </form>
</app-modal>
