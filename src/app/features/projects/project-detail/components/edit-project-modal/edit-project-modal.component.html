<app-modal
  [isOpen]="isOpen()"
  title="Editar Información de la Obra"
  subtitle="Actualiza el nombre, estado operativo, superficie y tipo de cambio"
  maxWidthClass="max-w-lg"
  (close)="close.emit()"
>
  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Nombre de la Obra -->
    <div class="space-y-1.5">
      <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
        Nombre de la Obra <span class="text-rose-500">*</span>
      </label>
      <input
        type="text"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        name="name"
        required
        placeholder="Ej: Proyecto Zabalaga"
        class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-medium focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
      />
    </div>

    <!-- Estado de la Obra -->
    <div class="space-y-1.5">
      <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
        Estado de la Obra <span class="text-rose-500">*</span>
      </label>
      <app-custom-select
        [options]="statusOptions"
        [value]="status()"
        (valueChange)="status.set($any($event))"
        placeholder="Seleccionar estado"
      />
    </div>

    <!-- 2 Columnas: Superficie Construida (m2) y Tipo de Cambio (Bs/USD) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-1">
      <div class="space-y-1.5">
        <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
          Superficie Construida (m²)
        </label>
        <div class="relative">
          <input
            type="number"
            step="0.01"
            min="0"
            [ngModel]="builtArea()"
            (ngModelChange)="builtArea.set($event)"
            name="builtArea"
            placeholder="Ej: 229.50"
            class="w-full px-3.5 py-2.5 pr-12 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-mono focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
          />
          <span class="absolute right-3.5 top-2.5 text-xs text-slate-400 font-bold pointer-events-none">
            m²
          </span>
        </div>
        <p class="text-[10px] text-slate-400">Usado para calcular el costo por m².</p>
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
          Tipo de Cambio (Bs/$)
        </label>
        <div class="relative">
          <input
            type="number"
            step="0.01"
            min="0.01"
            [ngModel]="exchangeRate()"
            (ngModelChange)="exchangeRate.set($event)"
            name="exchangeRate"
            placeholder="6.97"
            class="w-full px-3.5 py-2.5 pr-14 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-mono focus:outline-hidden focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 shadow-2xs"
          />
          <span class="absolute right-3.5 top-2.5 text-xs text-slate-400 font-bold pointer-events-none">
            Bs/$
          </span>
        </div>
        <p class="text-[10px] text-slate-400">Para conversión a Dólares.</p>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center justify-end gap-2.5 pt-4 border-t border-slate-100">
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 rounded-2xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="isSaving() || !name().trim()"
        class="px-5 py-2.5 rounded-2xl text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 active:scale-95 disabled:opacity-50 transition-all shadow-md shadow-amber-600/20 cursor-pointer flex items-center gap-2"
      >
        @if (isSaving()) {
          <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          Guardando...
        } @else {
          Guardar Cambios
        }
      </button>
    </div>
  </form>
</app-modal>
